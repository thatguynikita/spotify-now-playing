<div id="now-playing" class="now-playing">
  <div class="now-playing__track" id="now-playing-track">Loading…</div>
</div>

<style>
  .now-playing {
    overflow: hidden;
    white-space: nowrap;
    width: 100%;
    box-sizing: border-box;
    padding: 0.4rem 0;
  }

  .now-playing__track {
    display: inline-block;
    padding-left: 100%;
    animation: now-playing-scroll 15s linear infinite;
  }

  /* Pause the scroll if nothing is playing, so it doesn't loop pointlessly */
  .now-playing.is-idle .now-playing__track {
    animation: none;
    padding-left: 0;
  }

  @keyframes now-playing-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-100%); }
  }
</style>

<script>
  (function () {
    const el = document.getElementById('now-playing');
    const trackEl = document.getElementById('now-playing-track');
    const ENDPOINT = '/now-playing.json'; // adjust if hosted elsewhere
    const POLL_MS = 20000; // match roughly to your systemd timer interval

    async function update() {
      try {
        const res = await fetch(ENDPOINT, { cache: 'no-store' });
        const data = await res.json();

        if (data.is_playing && data.track) {
          const text = `♫ ${data.track} — ${data.artist}`;
          trackEl.textContent = text;
          el.classList.remove('is-idle');
        } else {
          trackEl.textContent = 'Not listening to anything right now';
          el.classList.add('is-idle');
        }
      } catch (e) {
        trackEl.textContent = '';
        el.classList.add('is-idle');
      }
    }

    update();
    setInterval(update, POLL_MS);
  })();
</script>
